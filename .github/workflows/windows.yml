name: Windows build and native-acceptance-gated release
on:
  push:
    branches: [main, 'feature/quota-history-monitoring-20261114']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multicodex-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Windows x64 tests, GUI and installer verification
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Locked dependencies, full tests, bundle and actual installer verification
        shell: pwsh
        run: ./tools/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: output/*
          if-no-files-found: error
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failed-checks
          path: evidence/
          if-no-files-found: ignore
  publish:
    name: Publish only the natively accepted installer
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - name: Require acceptance bound to this commit and setup hash
        env:
          MULTICODEX_RELEASE_ACCEPTANCE: ${{ vars.MULTICODEX_RELEASE_ACCEPTANCE }}
        run: |
          python tools/release_gate.py --commit "$GITHUB_SHA" --setup release-assets/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
