name: Windows build and native-acceptance-gated release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multicodex-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Windows x64 tests, GUI and installer verification
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - name: Locked dependencies, full tests, bundle and actual installer verification
        shell: pwsh
        run: ./tools/build_windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: generated/runtime/output/*
          if-no-files-found: error
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-failed-checks
          path: generated/runtime/evidence/
          if-no-files-found: ignore
  publish:
    name: Publish only the natively accepted installer
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == true
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-installer
          path: release-assets
      - name: Require acceptance bound to this commit and setup hash
        env:
          MULTICODEX_RELEASE_ACCEPTANCE: ${{ vars.MULTICODEX_RELEASE_ACCEPTANCE }}
          MULTICODEX_GITHUB_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python tools/release_gate.py --commit "$GITHUB_SHA" --setup release-assets/*.exe --sbom release-assets/SBOM.cdx.json --license-report release-assets/license-report.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
