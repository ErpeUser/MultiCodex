name: Feature branch verification
on:
  push:
    branches: ['feature/quota-history-monitoring-20261114']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feature-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-node:
    name: Full Python and Node regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix bridge --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Full test suites with real Tk widgets
        run: |
          mkdir -p evidence
          xvfb-run -a python -m unittest discover -s tests -v 2>&1 | tee evidence/python-tests.log
          node --test bridge/tests/service.test.mjs 2>&1 | tee evidence/node-tests.log
          python -m compileall -q multicodex tests tools run.py
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: GUI smoke without production accounts
        run: xvfb-run -a python run.py --gui-smoke --report evidence/gui-check.json
      - name: Source and public UI wheels for offline reproduction
        if: always()
        run: |
          mkdir -p evidence/offline
          git archive --format=tar HEAD > evidence/offline/source.tar
          python -m pip download --no-deps --only-binary=:all: --dest evidence/offline customtkinter==5.2.2 darkdetect==0.8.0
          python -m pip freeze > evidence/environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-verification-${{ github.sha }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
